services:
  - type: web
    name: foodlens-api
    env: python
    buildCommand: |
      pip install -r requirements.txt &&
      python -m app.database.seed &&
      python -m app.context.refresh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://foodlens-ui.onrender.com

  - type: web
    name: foodlens-ui
    env: python
    buildCommand: |
      pip install -r requirements.txt &&
      python -m app.database.seed &&
      python -m app.context.refresh
    startCommand: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: API_URL
        value: https://foodlens-api.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://foodlens-ui.onrender.com